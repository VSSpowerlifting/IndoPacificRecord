name: Deploy Rendered Output

# Manual-only. Publishes the already-committed output/ directory from main
# to the gh-pages branch. Does NOT run the pipeline, does NOT scrape, does
# NOT call the Anthropic API, does NOT install Python.
#
# Use this when output/ has been re-rendered locally (e.g. after a template
# or design change) and you want it live before the next scheduled daily run.
#
# Publication goes through scripts/pages_release.py, which makes gh-pages equal
# the committed main:output of one main commit and refuses stale, rolled-back,
# divergent or out-of-band-modified Pages generations. The release contract is
# the module docstring of scripts/pages_release.py; the writer inventory and
# migration criteria are in docs/PAGES_WRITER_AUDIT_2026-10-15.md.

on:
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    # Only the head of main may be released; a dispatch from another ref or an
    # older trigger SHA must not publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main (full history for the ancestry checks)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify output/ exists
        run: |
          if [ ! -d output ] || [ -z "$(ls -A output)" ]; then
            echo "ERROR: output/ is missing or empty — nothing to deploy."
            exit 1
          fi
          echo "output/ contents:"
          ls -la output/

      # Validate the rendered output before publishing. Stdlib-only, so it runs
      # on the runner's system Python without installing project dependencies.
      # A non-zero exit blocks the deploy step below.
      - name: Validate rendered output
        run: python3 scripts/validate_output.py

      # Releases exactly the commit that was just validated. If gh-pages already
      # serves a newer generation this is a no-op; if gh-pages was changed
      # outside a release the step HOLDs (exit 3) instead of overwriting it.
      - name: Release output/ to GitHub Pages
        run: python3 scripts/pages_release.py --push --source "$(git rev-parse HEAD)" --writer "deploy_output_only ${{ github.run_id }}"
