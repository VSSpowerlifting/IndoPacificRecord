name: Philippines — Verified AFP Links to Production and Pages

# Owner decisions Oct 15 and Oct 18, 2026
# (config/afp_kemhan_owner_link_activation.json): only verified neutral AFP
# official-link metadata (URL, publisher date, attributed issuer and provenance)
# may be published automatically. The Oct 15 frozen 23-record cohort remains
# pinned as an independently verified baseline; the Oct 18 AFP-specific standing
# authorization also permits verified non-held future records without per-record
# human review. Disputes, version changes and source/rights anomalies still hold.
# No original AFP headline, body,
# photograph, translation, model summary or IPR analysis is published here.
#
# Sources:
#   * the public shadow/ph-afp history (pre-cutover originals), validated
#     here directly; and
#   * post-cutover private originals, which reach this workflow only as a
#     private-runner HMAC envelope (afp-envelope.json.gz + .mac). That path
#     stays held unless AFP_METADATA_BRIDGE_ENABLED is 'true' and
#     AFP_BRIDGE_KEY is configured.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ph_afp_verified_official_link_production.yml
      - core/ph_afp_release_validator.py
      - scripts/admit_ph_afp_official_links.py
  schedule:
    # Daily reconciliation/retry: recovers a run that committed main but
    # failed before Pages, and re-verifies the source history. Idempotent.
    - cron: '29 16 * * *'
  workflow_dispatch:
    inputs:
      envelope_b64:
        description: 'Private-runner signed, gzip metadata-only AFP envelope (base64)'
        required: false
        type: string
      envelope_mac:
        description: 'HMAC-SHA256 of the gzip envelope bytes'
        required: false
        type: string

permissions:
  contents: read

# Own group; cross-desk DB races are caught by the exact main/DB/Pages pins.
concurrency:
  group: philippines-verified-official-link-production
  cancel-in-progress: false

jobs:
  publish-philippines-official-links:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin exact main and refuse dirty or sidecar state
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/ph-prod-main-before"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Install existing source and site dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release, validator and renderer contracts
        run: |
          python -m unittest -v \
            tests.test_ph_afp_release_validator \
            tests.test_regional_official_link_release \
            tests.test_regional_official_link_render
      - name: Clone the public AFP source history
        env:
          SRC_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          git clone --quiet --single-branch --branch shadow/ph-afp \
            "$SRC_REMOTE" "$RUNNER_TEMP/afp-source"
          test -z "$(git -C "$RUNNER_TEMP/afp-source" status --porcelain)"
          git -C "$RUNNER_TEMP/afp-source" rev-parse HEAD > "$RUNNER_TEMP/ph-source-tip"
      - name: Accept a private envelope only when the bridge is activated
        if: ${{ inputs.envelope_b64 != '' || inputs.envelope_mac != '' }}
        env:
          BRIDGE_ENABLED: ${{ vars.AFP_METADATA_BRIDGE_ENABLED }}
          ENVELOPE_B64: ${{ inputs.envelope_b64 }}
          ENVELOPE_MAC: ${{ inputs.envelope_mac }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$BRIDGE_ENABLED" = true || {
            echo "::error::HOLD: AFP private metadata bridge is not activated"
            exit 1
          }
          test -n "$ENVELOPE_B64" && test -n "$ENVELOPE_MAC"
          printf '%s' "$ENVELOPE_B64" | base64 -d > "$RUNNER_TEMP/afp-envelope.json.gz"
          printf '%s\n' "$ENVELOPE_MAC" > "$RUNNER_TEMP/afp-envelope.mac"
          echo "ENVELOPE_ARGS=--signed-envelope $RUNNER_TEMP/afp-envelope.json.gz --signed-mac $RUNNER_TEMP/afp-envelope.mac" >> "$GITHUB_ENV"
      - name: Admit trusted-validated AFP links (scratch copy, atomic replace)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AFP_BRIDGE_KEY: ${{ secrets.AFP_BRIDGE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Repair schema before admission, as every other link release does:
          # a pending index extension (e.g. 0014 for NSC) is not a failed
          # AFP collection. This is the only step that writes pla_watch.db.
          python -m migrations.cli --apply --db "$GITHUB_WORKSPACE/pla_watch.db"
          python scripts/verify_db_current.py
          # shellcheck disable=SC2086
          python -m scripts.admit_ph_afp_official_links admit \
            --source-checkout "$RUNNER_TEMP/afp-source" \
            --source-commit "$(cat "$RUNNER_TEMP/ph-source-tip")" \
            --production-db "$GITHUB_WORKSPACE/pla_watch.db" ${ENVELOPE_ARGS:-}
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          python scripts/verify_db_current.py
      - name: Render site; verify the Philippines page independently
        env:
          SOURCE_DB: ${{ runner.temp }}/afp-source/state/shadow.db
        shell: bash
        run: |
          set -euo pipefail
          python site/render.py
          python scripts/validate_output.py
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path
          from bs4 import BeautifulSoup
          db = sqlite3.connect("file:pla_watch.db?mode=ro", uri=True)
          # Every admitted Philippines family (AFP, and NSC once separately
          # authorized) must render exactly; AFP keeps its frozen floor.
          rows = {r[0]: r[1] for r in db.execute(
              "SELECT source_identity, canonical_official_url FROM regional_official_source_links "
              "WHERE desk='philippines'")}
          afp = sum(1 for k in rows if k.startswith("afp:"))
          from core import official_link_index as link_index
          from core.regional_official_link_render import load_admitted_links
          admitted = load_admitted_links(Path("pla_watch.db"), "philippines")
          assert {r["source_identity"]: r["canonical_official_url"] for r in admitted} == rows
          def listed(html):
              soup = BeautifulSoup(html, "html.parser")
              return [(li["data-regional-official-source-id"], li.find("a")["href"])
                      for li in soup.select("li[data-regional-official-source-id]")]
          page = Path("output/philippines.html").read_text(encoding="utf-8")
          # The desk lists exactly the newest DESK_LINK_LIMIT admitted links
          # (AFP, then NSC); the full index below carries every admitted link.
          shown = link_index.desk_listing("philippines", admitted)
          # At least the frozen 23, plus any further authorized verified AFP links.
          assert afp >= 23 and listed(page) == [
              (r["source_identity"], r["canonical_official_url"]) for r in shown
          ], "rendered desk links differ from the newest SQLite rows"
          assert page.count('href="%s"' % link_index.hub_route("philippines")) == 1
          for forbidden in ("title_original", "text_original", "summary_english", "<iframe"):
              assert forbidden not in page, forbidden
          indexed = {}
          index_pages = [Path("output", link_index.hub_route("philippines"))]
          assert listed(index_pages[0].read_text(encoding="utf-8")) == []
          for month, month_rows in link_index.partition("philippines", admitted):
              month_path = Path("output", link_index.month_route("philippines", month))
              index_pages.append(month_path)
              month_got = listed(month_path.read_text(encoding="utf-8"))
              assert month_got == [(r["source_identity"], r["canonical_official_url"])
                                   for r in month_rows], month
              for sid, href in month_got:
                  assert sid not in indexed, sid
                  indexed[sid] = href
          assert indexed == rows, "full official-link index differs from SQLite"
          # Metadata links cannot carry source expression. The adjacent
          # Record list may use only titles already admitted by shared Daily.
          from core.daily_machine_records import load
          allowed = {r["source_identity"]: r["original_title"] for r in load(Path("pla_watch.db"))
                     if r["source_family"] == "ph_afp_articles" and r["original_title"]}
          src = sqlite3.connect("file:%s?mode=ro" % os.environ["SOURCE_DB"], uri=True)
          source_rows = list(src.execute(
              "SELECT source_identity, title_original, text_original FROM shadow_records"))
          for identity, title, body in source_rows:
              if title and title in page:
                  assert allowed.get(identity) == title, "unapproved AFP headline on public page"
              assert not (body and body[:120] in page), "original AFP body on public page"
          # Hub and month pages carry link metadata only: no AFP headline or
          # body, not even a title Daily may show on the desk's Record list.
          for index_path in index_pages:
              index_page = index_path.read_text(encoding="utf-8")
              for forbidden in ("title_original", "text_original", "summary_english", "<iframe"):
                  assert forbidden not in index_page, (str(index_path), forbidden)
              for identity, title, body in source_rows:
                  assert not (title and title in index_page), "AFP headline on index page"
                  assert not (body and body[:120] in index_page), "AFP body on index page"
          print("Admitted Philippines links rendered:", len(rows), "AFP:", afp,
                "desk:", len(shown), "index pages:", len(index_pages))
          PY
          python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
            --site-dir output --require-desk philippines
          python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
            --print-routes philippines > "$RUNNER_TEMP/ph-routes"
          test "$(head -n 1 "$RUNNER_TEMP/ph-routes")" = "philippines.html"
          # Pre-commit budget gate: the desk and every hub/month route keep the
          # default 120 KB cap. A route over its cap, or a route the DB requires
          # but the render lacks, HOLDs this writer before anything is staged.
          only=()
          while read -r route; do only+=(--only "$route"); done < "$RUNNER_TEMP/ph-routes"
          python scripts/verify_frontend_delivery.py --root output \
            --receipt "$RUNNER_TEMP/ph-budget.json" "${only[@]}"
          while read -r route; do sha256sum "output/$route"; done \
            < "$RUNNER_TEMP/ph-routes" > "$RUNNER_TEMP/ph-prod-page-sha"
          echo "All rendered output changes listed for audit, not bulk publication:"
          git diff --name-only -- output/
      - name: Refuse a moved source history or production main
        env:
          SRC_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote "$SRC_REMOTE" refs/heads/shadow/ph-afp | cut -f1)" = \
            "$(cat "$RUNNER_TEMP/ph-source-tip")" || {
            echo "::error::AFP source branch moved; retry on the exact new version"
            exit 1
          }
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/ph-prod-main-before")" || {
            echo "::error::Production main moved; aborting rather than replacing a changed DB"
            exit 1
          }
          sha256sum -c "$RUNNER_TEMP/ph-prod-page-sha"
      - name: Commit exactly live SQLite and Philippines HTML
        shell: bash
        run: |
          set -euo pipefail
          git add -- pla_watch.db output/philippines.html
          # The full official-link index: stage each budget-gated route by
          # name (hub plus month pages); -u records only the removal of a
          # tracked month that no longer has admitted rows. An unlisted new
          # file stays untracked and holds the Pages step before publication.
          while read -r route; do git add -- "output/$route"; done < "$RUNNER_TEMP/ph-routes"
          if [ -n "$(git ls-files -- output/philippines-official-links.html output/philippines-official-links)" ]; then
            git add -u -- output/philippines-official-links.html output/philippines-official-links
          fi
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "No new admitted links; nothing to commit"
            exit 0
          fi
          if echo "$staged" | grep -vE '^(pla_watch\.db|output/philippines\.html|output/philippines-official-links\.html|output/philippines-official-links/[0-9]{4}-[0-9]{2}\.html)$'; then
            echo "::error::Unexpected staged file; full-site publish prohibited"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Philippines: admit verified AFP link metadata and update page only"
          git push origin HEAD:main
      - name: Check out current Pages without uploading other files
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: philippines-existing-pages
          fetch-depth: 0
          persist-credentials: true
      - name: Publish only Philippines HTML to existing Pages branch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/ph-prod-page-sha"
          # Always reconcile Pages, even if an earlier attempt pushed main and
          # then failed before gh-pages: this is the unattended retry path.
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || {
            echo "::error::Main changed since this Philippines page was rendered"
            exit 1
          }
          git show HEAD:output/philippines.html | cmp - output/philippines.html
          while read -r route; do
            git show "HEAD:output/$route" | cmp - "output/$route"
          done < "$RUNNER_TEMP/ph-routes"
          test -z "$(git ls-files --others -- output/philippines-official-links.html output/philippines-official-links)"
          python - <<'PY'
          from scripts.verify_regional_source_index_readback import verify_philippines_original_routes
          verify_philippines_original_routes("pla_watch.db", "philippines-existing-pages")
          PY
          cd philippines-existing-pages
          test -z "$(git status --porcelain --untracked-files=all)"
          pages_old="$(git rev-parse HEAD)"
          cp ../output/philippines.html philippines.html
          rm -rf philippines-official-links.html philippines-official-links
          if [ -e ../output/philippines-official-links.html ]; then
            cp ../output/philippines-official-links.html philippines-official-links.html
            cp -R ../output/philippines-official-links philippines-official-links
          fi
          while read -r route; do cmp "../output/$route" "$route"; done < "$RUNNER_TEMP/ph-routes"
          git add -- philippines.html
          while read -r route; do git add -- "$route"; done < "$RUNNER_TEMP/ph-routes"
          if [ -n "$(git ls-files -- philippines-official-links.html philippines-official-links)" ]; then
            git add -u -- philippines-official-links.html philippines-official-links
          fi
          staged="$(git diff --cached --name-only)"
          if [ -n "$staged" ] && echo "$staged" | grep -vE '^(philippines\.html|philippines-official-links\.html|philippines-official-links/[0-9]{4}-[0-9]{2}\.html)$'; then
            echo "::error::Unexpected staged Pages file; full-site publish prohibited"
            exit 1
          fi
          if [ -n "$staged" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Philippines: publish verified AFP outbound links only"
          fi
          git fetch origin gh-pages
          test "$(git rev-parse origin/gh-pages)" = "$pages_old" || {
            echo "::error::Pages moved; never overwrite a concurrent release"
            exit 1
          }
          if [ -n "$staged" ]; then
            git push origin HEAD:gh-pages
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Independent readback of committed and deployed bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main gh-pages
          main_sha="$(git show origin/main:output/philippines.html | sha256sum | cut -d' ' -f1)"
          pages_sha="$(git show origin/gh-pages:philippines.html | sha256sum | cut -d' ' -f1)"
          test "$main_sha" = "$pages_sha" || {
            echo "::error::main output and gh-pages Philippines bytes differ"
            exit 1
          }
          echo "PASS: main:output/philippines.html == gh-pages:philippines.html ($main_sha)"
          # The full index: identical month inventory and bytes on both refs.
          test "$(git ls-tree --name-only origin/main output/philippines-official-links/ | sed 's|^output/||')" = \
            "$(git ls-tree --name-only origin/gh-pages philippines-official-links/)" || {
            echo "::error::main output and gh-pages Philippines index months differ"
            exit 1
          }
          while read -r route; do
            test "$(git show "origin/main:output/$route" | sha256sum)" = \
              "$(git show "origin/gh-pages:$route" | sha256sum)" || {
              echo "::error::main output and gh-pages differ for $route"
              exit 1
            }
          done < "$RUNNER_TEMP/ph-routes"
      - name: Independent fixed-origin HTTPS readback of desk and full index
        shell: bash
        run: |
          set -euo pipefail
          # Pages builds take 22-71 s; bounded wait (24 x 10 s), then fail.
          for attempt in $(seq 1 24); do
            if python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
              --site-dir output --require-desk philippines --https-desk philippines; then exit 0; fi
            sleep 10
          done
          exit 1

# Original bytes stay in the preserved source branch and private custody.
# No source artifact upload, bulk site push, AI request or editor email.
