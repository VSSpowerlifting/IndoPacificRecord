name: China historical titles — capped reviewed batch
on:
  workflow_dispatch:
    inputs:
      limit:
        description: At most 20 titles; dispatch next batch only after fidelity review
        default: '20'
        required: true
concurrency:
  group: china-title-completion-20261018
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  # This workflow file runs from main but checks out the separate operations
  # branch below, whose code predates the source-use hold. The hold therefore
  # has to stop the job here, not inside that checkout. Actions compares
  # strings case-insensitively, so this holds for any casing of "true".
  hold-notice:
    if: github.ref == 'refs/heads/main' && vars.IPR_CHINA_SOURCE_USE_HOLD == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "source-use hold - batch not run; no checkout, no model call, no checkpoint push"
  batch:
    if: github.ref == 'refs/heads/main' && vars.IPR_CHINA_SOURCE_USE_HOLD != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/china-title-completion-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - name: Configure checkpoint author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Reserve, translate headlines only and checkpoint
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IPR_CHINA_SOURCE_USE_HOLD: ${{ vars.IPR_CHINA_SOURCE_USE_HOLD }}
          TITLE_BATCH_LIMIT: ${{ inputs.limit }}
        run: python scripts/china_title_release_batch.py --limit "$TITLE_BATCH_LIMIT"
