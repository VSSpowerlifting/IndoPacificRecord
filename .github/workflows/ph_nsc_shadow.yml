name: Philippines NSC — retired public source writer

# NSC statements are stored with their original titles and text; a public
# branch is not confidential storage. The public shadow/ph-nsc history (zero
# captures at retirement) is preserved for audit. Collection moves to the
# separately gated private repository (archive/ph-nsc), and only signed
# neutral link metadata returns, via ph_nsc_verified_official_link_production.yml.
# This workflow has NO cron, NO manual dispatch, NO publisher access, and
# NO public NSC state writer. The historical workflow is preserved as an
# offline-only test fixture in tests/fixtures/ph_nsc_public_legacy_workflow.yml.
on:
  pull_request:
    paths:
      - ".github/workflows/ph_nsc_shadow.yml"
      - "tests/fixtures/ph_nsc_public_legacy_workflow.yml"
      - "tests/test_ph_nsc_shadow_runner.py"
      - "scripts/audit_shadow_workflow_bindings.py"
      - "tests/test_shadow_workflow_bindings.py"

permissions:
  contents: read

jobs:
  retired-source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check retired-public-source binding and no writer
        run: python -m unittest tests.test_shadow_workflow_bindings -q
