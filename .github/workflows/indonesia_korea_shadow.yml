name: South Korea Shadow Collection (legacy custody)

# RETIRED after the owner-approved Korea MND private-first custody cutover.
# This historical workflow never fetches government sources or pushes original
# evidence. Daily source collection belongs to the private repository's
# korea_mnd_private_first_collector.yml, gated until coordinated activation.
# This manual-only tombstone preserves readable Actions history and prevents
# an old branch name from silently becoming a second writer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy Korea source collection is retired
        run: |
          echo "::notice::Legacy public MND collector is retired. Use the restricted private-first workflow."
