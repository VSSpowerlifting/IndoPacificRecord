name: Sunday IPR Briefs — Private Owner Preview or Approved Editor Handoff

on:
  schedule:
    # Sunday ~3:17 p.m. EDT / ~2:17 p.m. EST (19:17 UTC).
    # Fail closed if Sunday's collection did not complete first.
    - cron: '17 19 * * 0'
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email Dylan? Also requires IPR_SUNDAY_EDITOR_DELIVERY_ENABLED=true"
        type: boolean
        required: true
        default: false
      reporting_saturday:
        description: "Optional YYYY-MM-DD reporting Saturday; blank selects most recently reached Saturday"
        type: string
        required: false
        default: ''
      preview_to_owner:
        description: "Email a private manuscript preview to the OWNER ONLY (not Dylan)? Requires IPR_PREVIEW_TO secret."
        type: boolean
        required: true
        default: false
      allow_historical_send:
        description: "Explicitly authorize emailing a previous week's Saturday packet"
        type: boolean
        required: true
        default: false
  # Saturday provisional draft and Sunday recheck notice, AFTER the real Daily
  # collection. Inert unless the owner sets IPR_WEEKEND_EDITORIAL_ENABLED=true;
  # that same variable retires the legacy Sunday schedule and manual path.
  workflow_run:
    workflows: ["Daily PLA Watch Update"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ipr-sunday-editorial-handoff
  cancel-in-progress: false

jobs:
  # Reconfirm that the triggering Daily run was the original scheduled main
  # collection and that its success marker is still the newest. The reporting
  # day is that run's own New York guard date, not this job's clock, and the
  # corpus commit read here is pinned for the draft job. Weekdays and
  # guard-skipped green runs end here with mode=none. Metadata only.
  weekend-collection:
    if: vars.IPR_WEEKEND_EDITORIAL_ENABLED == 'true' && github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Read-only upstream job/step evidence.
    outputs:
      mode: ${{ steps.verify.outputs.mode }}
      week_ending: ${{ steps.verify.outputs.week_ending }}
      collection_day: ${{ steps.verify.outputs.collection_day }}
      corpus_sha: ${{ steps.verify.outputs.corpus_sha }}
      reservation: ${{ steps.verify.outputs.reservation }}
    steps:
      - name: Checkout production corpus on main (read-only)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify the weekend Daily collection before any Brief work
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A rerun would repeat the paid draft and the email; refuse it. A new
          # run for an already reserved week is refused by the trigger itself.
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || {
            echo "::error::Refused: weekend editorial reruns are not automatic"; exit 2;
          }
          python -m scripts.weekend_collection_trigger \
            --event "$GITHUB_EVENT_PATH" \
            --marker .github/state/last_daily_run_date.txt \
            --github-output "$GITHUB_OUTPUT"
          # The marker just verified belongs to this exact commit.
          echo "corpus_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Sunday never writes a second automatic draft. It records only that the
  # Sunday collection exists; the owner runs the recheck locally against the
  # private Saturday packet and the revised manuscript.
  weekend-sunday-recheck-notice:
    needs: weekend-collection
    if: needs.weekend-collection.outputs.mode == 'sunday'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record Sunday collection and the owner-local recheck requirement
        env:
          WEEK_ENDING: ${{ needs.weekend-collection.outputs.week_ending }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEEK_ENDING" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
          {
            echo "Sunday collection verified for the week ending $WEEK_ENDING."
            echo "The Saturday provisional draft is NOT publication-ready until the"
            echo "owner-local Sunday recheck passes for the exact revised manuscript:"
            echo "python -m scripts.weekly_briefs_saturday_audit --saturday $WEEK_ENDING --saturday-packet <private> --revised-docx <private> --receipt-out <private>"
            echo "No draft, email, manuscript or artifact was produced by this job."
          } >> "$GITHUB_STEP_SUMMARY"

  sunday-editor-handoff:
    # Scheduled Sunday editor draft is the legacy default; manual sends still require opt-in.
    # The October 10 pilot approval/digest guard, live-source gates and Friday
    # exclusivity check remain mandatory. Scheduled Sunday targets Dylan;
    # owner-only preview is an explicitly separate manual dispatch.
    # IPR_WEEKEND_EDITORIAL_ENABLED=true retires that whole legacy path; the
    # same job then runs only for a verified Saturday collection.
    needs: weekend-collection
    if: >-
      !cancelled() && !failure() && (
      (vars.IPR_WEEKEND_EDITORIAL_ENABLED != 'true'
       && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'))
      || (vars.IPR_WEEKEND_EDITORIAL_ENABLED == 'true'
       && github.event_name == 'workflow_run'
       && needs.weekend-collection.outputs.mode == 'saturday'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUNDAY_SEND: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && vars.IPR_SUNDAY_EDITOR_DELIVERY_ENABLED == 'true' && inputs.send_email == true) }}
      # Legacy scheduled preview settings cannot conflict with Sunday's editor send.
      SUNDAY_OWNER_PREVIEW: 'false'
    steps:
      # The Saturday draft reads the same commit whose marker was verified,
      # never a later main; the legacy Sunday path keeps reading main.
      - name: Checkout production corpus (read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.weekend-collection.outputs.corpus_sha || 'main' }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Preflight private owner preview and exclusive delivery intent
        env:
          IPR_PREVIEW_REQUESTED: ${{ env.SUNDAY_OWNER_PREVIEW == 'true' || (github.event_name == 'workflow_dispatch' && inputs.preview_to_owner == true) }}
          IPR_EDITOR_SEND_REQUESTED: ${{ env.SUNDAY_SEND == 'true' }}
          IPR_PREVIEW_TO: ${{ secrets.IPR_PREVIEW_TO }}
          IPR_EDITOR_TO: ${{ secrets.IPR_EDITOR_TO }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts.sunday_editorial_handoff import single_address
          if os.environ["IPR_PREVIEW_REQUESTED"] == "true":
              if os.environ["IPR_EDITOR_SEND_REQUESTED"] == "true":
                  raise SystemExit(
                      "Refused: editor send and owner preview inputs cannot both be true"
                  )
              editor = single_address(
                  os.environ.get("IPR_EDITOR_TO", ""), "IPR_EDITOR_TO")
              owner = single_address(
                  os.environ.get("IPR_PREVIEW_TO", ""), "IPR_PREVIEW_TO")
              if owner.casefold() == editor.casefold():
                  raise SystemExit(
                      "Refused: owner preview email must differ from editor"
                  )
              print("Private owner preview recipient is configured and distinct.")
          else:
              print("Owner-only preview not requested.")
          PY

      # The first Oct10 edition needs exact-week owner authorization and an
      # exact reviewed-attachment digest BEFORE any AI call or Dylan email.
      # No-send owner previews do not require either setting.
      - name: Verify reporting Saturday and Sunday's successful database update
        env:
          IPR_EVENT: ${{ github.event_name }}
          IPR_WEEKEND_WEEK: ${{ needs.weekend-collection.outputs.week_ending }}
          IPR_WEEKEND_COLLECTION_DAY: ${{ needs.weekend-collection.outputs.collection_day }}
          IPR_MANUAL_SATURDAY: ${{ inputs.reporting_saturday || '' }}
          IPR_HISTORICAL_SEND: ${{ inputs.allow_historical_send == true }}
          IPR_OLD_FRIDAY_ACTIVE: ${{ vars.IPR_EDITOR_DELIVERY_ENABLED == 'true' }}
          IPR_SCHEDULED_OWNER_PREVIEW: ${{ env.SUNDAY_OWNER_PREVIEW == 'true' }}
          IPR_SUNDAY_OWNER_REVIEWED_WEEK: ${{ vars.IPR_SUNDAY_OWNER_REVIEWED_WEEK }}
          IPR_SUNDAY_OWNER_REVIEWED_SHA256: ${{ vars.IPR_SUNDAY_OWNER_REVIEWED_SHA256 }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from pathlib import Path
          from scripts.sunday_briefs_auto_writer import live_editorial_desks
          from scripts.weekly_briefs_sunday_window import (
              resolve_saturday_provisional, resolve_sunday_handoff)

          marker = Path(".github/state/last_daily_run_date.txt")
          last_successful_update = (
              marker.read_text(encoding="utf-8").strip()
              if marker.is_file() else ""
          )
          # The Saturday provisional draft: this Saturday's own collection,
          # no Friday substitution, the retired Friday service still off.
          provisional = os.environ["IPR_EVENT"] == "workflow_run"
          if provisional:
              if os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
                  raise SystemExit("Refused: weekend editorial reruns are not automatic")
              window = resolve_saturday_provisional(
                  collection_day=os.environ["IPR_WEEKEND_COLLECTION_DAY"],
                  saturday_daily_marker=last_successful_update,
                  friday_delivery_enabled=os.environ["IPR_OLD_FRIDAY_ACTIVE"] == "true",
              )
              if window["IPR_SUNDAY_WEEK_END"] != os.environ["IPR_WEEKEND_WEEK"]:
                  raise SystemExit("Refused: Saturday differs from the verified collection")
          else:
              window = resolve_sunday_handoff(
                  event=os.environ["IPR_EVENT"],
                  reporting_saturday=os.environ["IPR_MANUAL_SATURDAY"],
                  send_email=os.environ["SUNDAY_SEND"] == "true",
                  allow_historical_send=os.environ["IPR_HISTORICAL_SEND"] == "true",
                  sunday_daily_marker=last_successful_update,
                  friday_delivery_enabled=os.environ["IPR_OLD_FRIDAY_ACTIVE"] == "true",
                  scheduled_owner_preview=os.environ["IPR_SCHEDULED_OWNER_PREVIEW"] == "true",
                  pilot_owner_reviewed_week=os.environ.get("IPR_SUNDAY_OWNER_REVIEWED_WEEK", ""),
                  pilot_owner_reviewed_sha256=os.environ.get("IPR_SUNDAY_OWNER_REVIEWED_SHA256", ""),
              )
          desks = live_editorial_desks()
          if len(desks) < 2:
              raise SystemExit("Refused: fewer than two production-backed desks")
          for key, value in window.items():
              print(key + "=" + value)
          print("IPR_SUNDAY_DESKS=" + ",".join(desks))
          print("IPR_SATURDAY_PROVISIONAL=" + ("true" if provisional else "false"))
          print("IPR_COLLECTION_DAY=" + (
              os.environ["IPR_WEEKEND_COLLECTION_DAY"] if provisional else ""))
          PY

      # Promote the independent #240 corpus diagnostic to an enforceable
      # no-LLM/no-email gate. This uses only a scratch SQLite read and
      # source-availability counts. Current Sunday requires the exact same-day
      # successful collection marker; historical replays are marked unattested.
      - name: Quarantine Korea before any Sunday source refresh
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.sunday_korea_quarantine_gate \
            --packet "$GITHUB_WORKSPACE/research/briefs_editorial_evidence/$IPR_SUNDAY_WEEK_END.json" \
            --week-ending "$IPR_SUNDAY_WEEK_END" --as-of "$IPR_SUNDAY_AS_OF" \
            --permit-missing

      - name: Verify bounded Japan/Vietnam editorial source packet offline
        run: |
          python - <<'PY'
          from core.brief_editorial_evidence import load_editorial_evidence
          import os
          rows = load_editorial_evidence(
              os.environ["IPR_SUNDAY_WEEK_END"],
              os.environ["IPR_SUNDAY_AS_OF"],
          )
          print("Private source-linked research candidates:", len(rows))
          print("This verification is NOT source approval or corpus admission.")
          PY

      # A week-specific JSON file is an editorial seed, NOT proof that its
      # Vietnam rows still match current independently collected MPS source.
      # Re-derive the Vietnam section immediately before the one-theme model
      # call; preserve Japan's separately supplied research rows byte-for-byte.
      - name: Select bounded source notes and regional packet for this Sunday
        id: vietnam_sources
        shell: bash
        run: |
          set -euo pipefail
          # Previous step exported this via GITHUB_ENV at runner execution
          # time. Turn it into an explicit step output for action expressions.
          REPORTING_SATURDAY="$IPR_SUNDAY_WEEK_END"
          [[ "$REPORTING_SATURDAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          echo "week_ending=$REPORTING_SATURDAY" >> "$GITHUB_OUTPUT"
          packet="research/briefs_editorial_evidence/$REPORTING_SATURDAY.json"
          notes="research/vietnam_briefs_candidates/editorial_notes_$REPORTING_SATURDAY.json"
          for candidate in "$packet" "$notes"; do
            if [[ -e "$candidate" && ! -f "$candidate" ]]; then
              echo "::error::Invalid or non-regular week-specific research file: $candidate"
              exit 1
            fi
            if [[ -L "$candidate" ]]; then
              echo "::error::Symlinked week-specific evidence is not allowed"
              exit 1
            fi
          done
          if [[ -f "$packet" ]]; then
            echo "existing=$packet" >> "$GITHUB_OUTPUT"
          else
            echo "existing=" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$notes" ]]; then
            echo "notes=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi
          # First Sunday pilot requires genuine current MPS research, rather
          # than silently dropping Vietnam while claiming it contributed.
          # Future weeks may be empty ONLY via explicit no-Vietnam policy.
          if [[ "$REPORTING_SATURDAY" == "2026-10-10" ]]; then
            echo "missing_policy=refuse" >> "$GITHUB_OUTPUT"
            echo "require_vietnam=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing_policy=continue-without-vietnam" >> "$GITHUB_OUTPUT"
            echo "require_vietnam=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit current Vietnam MPS shadow state and refresh private Sunday research
        id: vietnam_current
        uses: ./.github/actions/vietnam-editorial-evidence
        with:
          week-ending: ${{ steps.vietnam_sources.outputs.week_ending }}
          notes: ${{ steps.vietnam_sources.outputs.notes }}
          missing-notes-policy: ${{ steps.vietnam_sources.outputs.missing_policy }}
          require-vietnam: ${{ steps.vietnam_sources.outputs.require_vietnam }}
          existing-packet: ${{ steps.vietnam_sources.outputs.existing }}

      - name: Quarantine Korea in refreshed model source packet
        shell: bash
        env:
          PRIVATE_WEEK_PACKET: ${{ steps.vietnam_current.outputs.packet }}
        run: |
          set -euo pipefail
          python -m scripts.sunday_korea_quarantine_gate \
            --packet "$PRIVATE_WEEK_PACKET" \
            --week-ending "$IPR_SUNDAY_WEEK_END" --as-of "$IPR_SUNDAY_AS_OF"

      - name: Verify refreshed exact-week research before the model call
        env:
          PRIVATE_WEEK_PACKET: ${{ steps.vietnam_current.outputs.packet }}
          PRIVATE_VN_COUNT: ${{ steps.vietnam_current.outputs.vietnam-count }}
          PRIVATE_VN_MACHINE_ELIGIBLE: ${{ steps.vietnam_current.outputs.machine-eligible-count }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from core.brief_editorial_evidence import load_editorial_evidence
          week = os.environ["IPR_SUNDAY_WEEK_END"]
          path = Path(os.environ["PRIVATE_WEEK_PACKET"])
          if not path.is_file() or path.name != week + ".json":
              raise SystemExit("Refused: missing or wrong-week MPS-verified research packet")
          rows = load_editorial_evidence(week, os.environ["IPR_SUNDAY_AS_OF"],
                                        directory=path.parent)
          vn = sum(row["desk"] == "vietnam" for row in rows)
          if vn != int(os.environ["PRIVATE_VN_COUNT"]):
              raise SystemExit("Refused: MPS review count differs from model evidence")
          eligible = int(os.environ["PRIVATE_VN_MACHINE_ELIGIBLE"])
          if eligible < vn or eligible < 0:
              raise SystemExit("Refused: impossible current MPS source eligibility count")
          if week == "2026-10-10" and eligible != vn:
              raise SystemExit("Refused: strict pilot must account for all in-window MPS sources before model/email")
          if eligible > vn:
              print("::warning::%d verified MPS sources currently lack short, version-matched private synopses; omission is NOT official silence." % (eligible - vn))
          print("Source-audited private research roster: %d Vietnam items, %d other desk items, %d eligible in MPS archive"
                % (vn, len(rows) - vn, eligible))
          print("Neither source rights nor official silence nor publication approved.")
          PY

      # Privately drafted MPS synopses must not flow into any emailed
      # worksheet (Dylan or owner-only preview) without separately approved,
      # exact-week distribution consent. Keep private no-send drafting intact.
      # For an email lacking consent, preserve non-Vietnam editorial delivery
      # using a verified temporary packet; never mutate the private original.
      - name: Separate Vietnam private-model and editor-email research scope
        id: editor_scope
        env:
          PRIVATE_WEEK_PACKET: ${{ steps.vietnam_current.outputs.packet }}
          IPR_VN_EMAIL_REVIEWED_WEEK: ${{ vars.IPR_SUNDAY_VIETNAM_EDITOR_SEND_REVIEWED_WEEK }}
          IPR_PREVIEW_REQUESTED: ${{ env.SUNDAY_OWNER_PREVIEW == 'true' || (github.event_name == 'workflow_dispatch' && inputs.preview_to_owner == true) }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_WEEK_PACKET" && -f "$PRIVATE_WEEK_PACKET" ]] || {
            echo "::error::Current-week research packet missing before editor-send gate"
            exit 2
          }
          scratch="$(mktemp -d "$RUNNER_TEMP/ipr-editor-safe-XXXXXXXX")"
          args=(--week-ending "$IPR_SUNDAY_WEEK_END"
                --as-of "$IPR_SUNDAY_AS_OF"
                --packet "$PRIVATE_WEEK_PACKET"
                --approved-week "$IPR_VN_EMAIL_REVIEWED_WEEK"
                --safe-out "$scratch/$IPR_SUNDAY_WEEK_END.json")
          # Both editor delivery and owner preview transmit data via SMTP.
          # Private no-send drafting is the only path that keeps Vietnam rows
          # without a separate week-specific email authorization.
          if [[ "$IPR_SUNDAY_SHOULD_SEND" == "true" || "$IPR_PREVIEW_REQUESTED" == "true" ]]; then
            args+=(--send-email)
          fi
          python -m scripts.sunday_research_editor_delivery_gate "${args[@]}" > "$scratch/scope.json"
          python - "$scratch/scope.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          receipt = json.load(open(sys.argv[1], encoding="utf-8"))
          print("packet=" + receipt["effective_packet"])
          print("vietnam_withheld=" + str(receipt["vietnam_withheld_from_editor_count"]))
          PY
          # Only sanitized counts; never print research claims or source bodies.
          python - "$scratch/scope.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding="utf-8"))
          print("Private MPS model-only synopses withheld from email:",
                r["vietnam_withheld_from_editor_count"])
          print("Editor-safe official-source research count:",
                r["editor_packet_source_count"])
          PY

      # Confirm the ACTUAL scratch packet reaching the unified model still
      # contains Japan. For the Oct10 pilot require the exact three pinned
      # Japan MOD research IDs; for later weeks label omitted Japan explicitly.
      # This step neither verifies original PDF fidelity nor approves sources.
      - name: Quarantine Korea in final model and email packet
        shell: bash
        env:
          PRIVATE_WEEK_PACKET: ${{ steps.editor_scope.outputs.packet }}
        run: |
          set -euo pipefail
          python -m scripts.sunday_korea_quarantine_gate \
            --packet "$PRIVATE_WEEK_PACKET" \
            --week-ending "$IPR_SUNDAY_WEEK_END" --as-of "$IPR_SUNDAY_AS_OF"

      - name: Attest Japan research offer in the refreshed single-theme packet
        env:
          PRIVATE_WEEK_PACKET: ${{ steps.editor_scope.outputs.packet }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_WEEK_PACKET" && -f "$PRIVATE_WEEK_PACKET" ]] || {
            echo "::error::Refused: missing current-source research packet"
            exit 2
          }
          python -m scripts.sunday_japan_offer_gate \
            --week-ending "$IPR_SUNDAY_WEEK_END" \
            --as-of "$IPR_SUNDAY_AS_OF" \
            --packet "$PRIVATE_WEEK_PACKET"

      # Evaluate the sanitized CURRENT-week research packet after refresh and
      # editor-scope restrictions. Typed sources can support an unapproved
      # editorial draft, but cannot represent live production desk coverage.
      - name: Require Sunday source readiness with verified editorial research
        shell: bash
        env:
          PRIVATE_WEEK_PACKET: ${{ steps.editor_scope.outputs.packet }}
        run: |
          set -euo pipefail
          args=(--week-ending "$IPR_SUNDAY_WEEK_END"
                --as-of "$IPR_SUNDAY_AS_OF"
                --research-packet "$PRIVATE_WEEK_PACKET")
          if [[ "$IPR_SATURDAY_PROVISIONAL" == "true" ]]; then
            # The verified collection day, not the runner clock after midnight.
            args+=(--saturday-provisional --review-local-day "$IPR_COLLECTION_DAY")
          fi
          python -m scripts.sunday_before_model_gate "${args[@]}"

      - name: Create read-only full Saturday-ending week source scaffold
        env:
          PACKET_SIDECAR: ${{ runner.temp }}/ipr-sunday-scaffold.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from config import DB_PATH
          from scripts.author_brief import build_draft
          from scripts.reconcile_db import read_only
          from storage.db import get_articles_for_desks

          desks = os.environ["IPR_SUNDAY_DESKS"].split(",")
          with read_only(Path(DB_PATH)) as conn:
              records = get_articles_for_desks(
                  os.environ["IPR_SUNDAY_WEEK_START"],
                  os.environ["IPR_SUNDAY_WEEK_END"], desks, conn=conn,
              )
          draft = build_draft(
              records, desks=desks,
              week_start=os.environ["IPR_SUNDAY_WEEK_START"],
              week_ending=os.environ["IPR_SUNDAY_WEEK_END"],
          )
          Path(os.environ["PACKET_SIDECAR"]).write_text(
              json.dumps(draft, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Unapproved full-week scaffold prepared from stored records through Saturday.")
          PY

      # Once-only per reporting week, ported from #957. This step's evaluated
      # name is the reservation: the trigger refuses any later run for the same
      # week once it has started here, so it sits after every free gate and
      # immediately before the paid model call. A failed attempt is never
      # retried automatically. Metadata only; no artifact or repository write.
      - name: Model attempt ${{ needs.weekend-collection.outputs.reservation }}
        if: env.IPR_SATURDAY_PROVISIONAL == 'true'
        env:
          IPR_RESERVATION: ${{ needs.weekend-collection.outputs.reservation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" \
             && "$IPR_RESERVATION" == "ipr-weekend-saturday-$IPR_SUNDAY_WEEK_END" ]] || {
            echo "::error::Refused: reservation differs from the verified week"; exit 2;
          }
          echo "Reserved $IPR_RESERVATION (run $GITHUB_RUN_ID); never retried automatically." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Generate source-cited Sunday manuscript and optionally email Dylan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IPR_EDITOR_TO: ${{ secrets.IPR_EDITOR_TO }}
          IPR_SMTP_USER: ${{ secrets.IPR_SMTP_USER }}
          IPR_SMTP_APP_PASSWORD: ${{ secrets.IPR_SMTP_APP_PASSWORD }}
          IPR_PREVIEW_TO: ${{ secrets.IPR_PREVIEW_TO }}
          IPR_PREVIEW_REQUESTED: ${{ env.SUNDAY_OWNER_PREVIEW == 'true' || (github.event_name == 'workflow_dispatch' && inputs.preview_to_owner == true) }}
          IPR_SUNDAY_OWNER_REVIEWED_WEEK: ${{ vars.IPR_SUNDAY_OWNER_REVIEWED_WEEK }}
          IPR_SUNDAY_OWNER_REVIEWED_SHA256: ${{ vars.IPR_SUNDAY_OWNER_REVIEWED_SHA256 }}
          PRIVATE_WEEK_PACKET: ${{ steps.editor_scope.outputs.packet }}
        shell: bash
        run: |
          [[ -n "$PRIVATE_WEEK_PACKET" && -f "$PRIVATE_WEEK_PACKET" ]] || {
            echo "::error::Refused: no current-shadow-attested Sunday research packet"; exit 2;
          }
          args=(--sidecar "$RUNNER_TEMP/ipr-sunday-scaffold.json"
                --out "$RUNNER_TEMP/IPR-Briefs-Editorial-$IPR_SUNDAY_WEEK_END.txt"
                --write-automatic --full-week --include-research
                --research-packet "$PRIVATE_WEEK_PACKET"
                --as-of "$IPR_SUNDAY_AS_OF")
          if [[ "$IPR_SATURDAY_PROVISIONAL" == "true" ]]; then
            # Provisional header, DOCX label and receipt; never complete-week.
            args+=(--saturday-provisional)
          fi
          if [[ "$IPR_SUNDAY_SHOULD_SEND" == "true" ]]; then
            [[ "$IPR_PREVIEW_REQUESTED" != "true" ]] || {
              echo "::error::Editor delivery and owner-only preview cannot both be requested"; exit 2;
            }
            args+=(--send)
          elif [[ "$IPR_PREVIEW_REQUESTED" == "true" ]]; then
            args+=(--preview-to-owner)
          fi
          python -m scripts.sunday_editorial_handoff "${args[@]}"

      # Owner-only preview requires manual workflow_dispatch and a distinct
      # IPR_PREVIEW_TO secret. Scheduled Sunday is reserved for Dylan only.
      # Neither mode grants manuscript publication.
      # No public manuscript artifact; no push, approval, numbering or deploy.
      # A Saturday provisional draft stays unready until the Sunday recheck
      # receipt matches the exact revised manuscript at import.
