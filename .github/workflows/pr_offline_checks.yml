# Offline validation for pull requests.
#
# Why this exists: until now no workflow carried a `pull_request` trigger, so a
# PR arrived with zero checks and the only automated path that ran the suite was
# `daily_update.yml` — which also collects, spends, writes `pla_watch.db` and
# deploys. Reviewing a change therefore meant either trusting a local run or
# running production. This job closes that gap and nothing else.
#
# Exact PR-merge diff is classified fail-closed. Markdown-only changes use
# lightweight checks; bounded timeline presentation changes run actual
# browser/timeline contracts. All unknown, data, source and code changes
# retain full offline CI. No step collects or deploys, and no credentials are used.
#
# Chromium. `requirements.txt` carries the playwright PACKAGE, which is why
# `from playwright.sync_api import ...` has always succeeded here — but `pip
# install` fetches no browser binary. The browser fixtures catch the resulting
# launch failure and turn it into `SkipTest`, so this job reported green while
# thirteen browser-backed classes never ran (PR #51: `Ran 2045 tests … OK
# (skipped=14)`, thirteen of them `chromium not available`). The daily run,
# which installs the browser, executed the same tree as `Ran 2091 tests … OK
# (skipped=1)`. A check that silently drops the browser contracts it claims to
# cover is worse than no check, so the browser is installed below and then
# LAUNCHED before the suite: an install can half-succeed, and a path that
# exists is not a browser that starts.
#
# Trigger choice. `pull_request` runs the workflow definition taken from the
# PR's merge commit (the base branch merged with the PR head), with the
# permissions declared below. The alternative, `pull_request_target`, instead
# runs the workflow definition from the BASE branch in the base repository's
# context, where a token and secrets can be available. That is not dangerous by
# itself — the hazard appears when such a privileged context is combined with
# checking out or executing PR-controlled code. This job avoids the question
# entirely: `pull_request`, explicit read-only permissions, no secrets, and no
# persisted checkout credential.
#
# It can run without migrations only because the tracked database is now read
# through `reconcile_db.read_only` (PR #1). Before that, `validate_output.py`
# could not open a sidecar-less WAL database on a clean checkout and silently
# downgraded check 8 to a warning — a green run here would have meant nothing.

name: PR offline checks

on:
  # Trusted qualification uses the actual push SHA/workflow, not a PR's
  # unauthenticated assertion about its historical synthetic merge.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Read-only. This job has no reason to write to the repository, and a token
# that cannot write cannot be talked into pushing test residue.
permissions:
  contents: read

# One in-flight run per PR; a new push supersedes the previous check.
concurrency:
  group: pr-offline-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  offline-checks:
    # Draft iterations allocate no runner. ready_for_review runs this same full
    # gate even without a new commit; every later synchronize runs it again.
    # A skipped draft check is never full-suite evidence for an exact-head merge.
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    # Run 40346079812 attempt 1 exhausted 35m after a 12m19s Chromium
    # install and 21m52s suite; allow setup variance without weakening gates.
    timeout-minutes: 45

    steps:
      # No `ref:` — for a pull_request event this checks out the merge of the
      # PR into its base, which is what the reviewer is deciding about.
      #
      # `persist-credentials: false` because nothing here needs git auth. The
      # default writes the job token into .git/config as an extraheader, where
      # any later step — including this PR's own test code — could read it.
      # Frozen historical replay objects are fetched below without credentials.
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2  # PR merge commit and base parent for scoped diff

      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
          cache: 'pip'

      # Recorded BEFORE dependencies are installed. `requirements.txt` comes
      # from the pull request, so `pip install` is the first point at which
      # PR-controlled code executes; the baseline has to predate it or it is
      # measuring a state the PR could already have altered.
      - name: Record tracked database baseline
        id: baseline
        run: |
          set -euo pipefail
          if [ -e pla_watch.db-wal ] || [ -e pla_watch.db-shm ]; then
            echo "::error title=Unexpected sidecar::A checkout must not carry pla_watch.db-wal or pla_watch.db-shm."
            exit 1
          fi
          echo "db=$(sha256sum pla_watch.db | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Tracked database baseline recorded."

      # Capture the DB hash before running any PR-controlled Python code.
      - name: Classify changed paths against PR base
        id: scope
        run: python scripts/pr_ci_scope.py --base HEAD^1 --head HEAD --github-output "$GITHUB_OUTPUT"

      # Supply exact frozen history for applicable pilot/review contracts.
      # Object retrieval is public/read-only; it changes no branch or worktree.
      - name: Verify GPG and restore frozen historical replay objects
        if: ${{ steps.scope.outputs.mode == 'full' }}
        run: |
          set -euo pipefail
          gpg --version
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event.get('pull_request')
          if pr:
              print('Tested PR head:', pr['head']['sha'], flush=True)
              print('Tested base:', pr['base']['sha'], flush=True)
          print('Actual checkout:', subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip(), flush=True)
          origins = json.loads(Path('research/topic_pilot_v1/ledger.json').read_text())['origins']
          for name, origin in sorted(origins.items()):
              commit = origin['commit']
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1',
                  'https://github.com/VSSpowerlifting/IndoPacificRecord.git', commit], check=True)
              spec = commit + ':' + origin['path']
              actual = subprocess.check_output(['git', 'rev-parse', spec], text=True).strip()
              if actual != origin['blob']:
                  raise SystemExit('Frozen source blob mismatch: ' + name)
              subprocess.run(['git', 'cat-file', '-e', actual], check=True)
              print('Frozen object verified:', name, spec, actual, flush=True)
          japan = json.loads(Path('tests/fixtures/japan_mod_official_links.json').read_text())
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1',
              'https://github.com/VSSpowerlifting/IndoPacificRecord.git', japan['source_commit']], check=True)
          actual = subprocess.check_output(['git', 'rev-parse',
              japan['source_commit'] + ':state/shadow.db'], text=True).strip()
          if actual != japan['source_db_git_blob']:
              raise SystemExit('Japan frozen collection blob mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('JAPAN_MOD_FROZEN_REPLAY=1\n')
          PYTHON

      # First execution of PR-controlled content.
      - name: Install dependencies
        if: ${{ steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'focused' }}
        run: pip install -r requirements.txt

      # Omit the redundant fast preflight: full CI reran every selected test.

      # The browser binary, with its system libraries. Same command the daily
      # workflow uses, so the two runs exercise one browser story rather than
      # two. `--with-deps` shells out to the runner's package manager; it needs
      # OS privileges on the ephemeral runner, never repository privileges, and
      # the job token stays read-only.
      - name: Install Chromium for the browser-backed tests
        if: ${{ steps.scope.outputs.browser == 'true' }}
        run: playwright install chromium --with-deps

      # Launch it. The fixtures downgrade a launch failure to SkipTest, which
      # is precisely the failure this job must not absorb, so the launch is
      # proved here where a failure is a failure. A missing shared library, a
      # partial download or a blocked sandbox all leave an executable on disk
      # that will not start — testing for the path would miss every one.
      #
      # The heredoc is quoted (<<'PY'), so the shell performs no expansion on
      # the script and no workflow expression is interpolated into it.
      - name: Verify Chromium launches
        if: ${{ steps.scope.outputs.browser == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              print("chromium %s launched" % browser.version)
              browser.close()
          PY

      - name: Replay all frozen pilot sources and independent review excerpts
        if: ${{ steps.scope.outputs.source_replay == 'true' }}
        run: |
          set -euo pipefail
          python scripts/topic_pilot.py --verify-sources
          python - <<'PYTHON'
          import json
          from scripts import topic_pilot as pilot
          from tests.test_topic_pilot_review import REVIEW, validate_review, replay_data

          review = json.loads(REVIEW.read_text())
          validate_review(review)
          count = pilot.verify_sources(replay_data(review))
          if count != 60:
              raise SystemExit('Incomplete historical review replay: ' + str(count))
          print('Verified %d pinned review excerpts; no database writes.' % count)
          PYTHON

      # Measured in the same environment as the suite. The job evidence below
      # is accepted only when this exact reviewed workflow/tree is equivalent
      # to Daily's main checkout, and every required step actually succeeded.
      - name: Measure qualification environment
        id: qualification_environment
        if: ${{ steps.scope.outputs.mode == 'full' }}
        run: python -m scripts.code_qualification environment --github-output "$GITHUB_OUTPUT"

      # The suite uses temporary databases and never touches the tracked file.
      # The assertion below is what makes that a fact rather than a claim.
      - name: Run offline test suite
        if: ${{ steps.scope.outputs.mode == 'full' }}
        run: python -m unittest discover -s tests -t . -v

      # The focused path still has real Chromium and publication/rights tests.
      - name: Run focused timeline presentation contracts
        if: ${{ steps.scope.outputs.mode == 'focused' }}
        run: |
          python - <<'PY'
          import sys, unittest
          names = (
              'tests.test_timeline_rendering',
              'tests.test_timelines',
              'tests.test_relief_primitives',
              'tests.test_site_mode_contract',
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          if suite.countTestCases() == 0:
              raise SystemExit('No focused tests collected')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      # Failed Daily recovery can preserve admissions without completing the
      # render. Exercise the repaired renderer on the exact synthetic merge in
      # an isolated tree; the checkout's DB/output remain evidence, untouched.
      # Keeping the normal repo layout also keeps validator check 8 enabled.
      - name: Render isolated output for validation
        id: validation_tree
        if: ${{ steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'focused' }}
        run: |
          set -euo pipefail
          candidate="$(mktemp -d "${RUNNER_TEMP}/ipr-pr-validation.XXXXXX")"
          git archive HEAD | tar -x -C "$candidate"
          python "$candidate/site/render.py" --site-origin https://indopacificrecord.org
          echo "root=$candidate" >> "$GITHUB_OUTPUT"

      # The unchanged deploy gate, including analyzed-record coverage, now
      # checks the freshly rendered candidate rather than an older deployment.
      - name: Validate rendered output
        if: ${{ steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'focused' }}
        working-directory: ${{ steps.validation_tree.outputs.root }}
        run: python scripts/validate_output.py

      # Main-push head_sha is authenticated by GitHub's run/job API. PR runs
      # cannot certify reuse, even if they fabricate this step's name.
      - name: Qualification environment ${{ steps.qualification_environment.outputs.digest }}
        if: ${{ github.event_name == 'push' && steps.scope.outputs.mode == 'full' }}
        # github.sha is a GitHub-generated hexadecimal object ID, never PR text.
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      # Must run even when a step above failed: a failing suite that also
      # dirtied the tracked database is exactly the case worth seeing, and the
      # default `success()` would hide it. Not after cancellation, where a
      # half-finished run proves nothing, and not unless the baseline itself
      # succeeded, since every comparison below is against its output.
      #
      # Four independent questions, none of which subsumes another:
      #   - has the database's content changed (hash, blind to git);
      #   - does the tracked database differ from the checkout (git diff);
      #   - does anything under output/ differ from the checkout (git diff);
      #   - has anything untracked appeared beside either (git status), which
      #     a diff against the index cannot see;
      # plus the sidecar check, which catches a read that bypassed the helper
      # even when it left the database itself byte-identical.
      - name: Assert the tracked database and output are unchanged
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        run: |
          set -euo pipefail
          failed=0

          after_db="$(sha256sum pla_watch.db | cut -d' ' -f1)"
          if [ "$after_db" != "${{ steps.baseline.outputs.db }}" ]; then
            echo "::error title=Database modified::pla_watch.db changed during the run."
            echo "  before ${{ steps.baseline.outputs.db }}"
            echo "  after  ${after_db}"
            failed=1
          fi

          if ! git diff --quiet -- pla_watch.db; then
            echo "::error title=Database modified::pla_watch.db differs from the checkout."
            git diff --stat -- pla_watch.db
            failed=1
          fi

          if ! git diff --quiet -- output/; then
            echo "::error title=Output modified::output/ differs from the checkout."
            git diff --stat -- output/
            failed=1
          fi

          dirty="$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          if [ -n "${dirty}" ]; then
            echo "::error title=Working tree dirty::pla_watch.db or output/ was modified, or an untracked file appeared beside them."
            echo "${dirty}"
            failed=1
          fi

          if [ -e pla_watch.db-wal ] || [ -e pla_watch.db-shm ]; then
            echo "::error title=Sidecar residue::a -wal or -shm was left beside the tracked database; reads must go through reconcile_db.read_only."
            ls -l pla_watch.db-wal pla_watch.db-shm 2>/dev/null || true
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "Tracked database and output/ unchanged; no sidecar residue."
