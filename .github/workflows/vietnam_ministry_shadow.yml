name: Vietnam Ministry Shadow Collection

# Public original writer retired by the coordinated private-first cutover.
# Preserve historical refs and the inert legacy job; new originals stay private.
# Only separately approved, metadata-only releases may run here.
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: reviewed-release
        options: [reviewed-release]
      target_date:
        description: >-
          Explicit logical date YYYY-MM-DD for recovery. Do not use the Actions
          re-run button for a failed scheduled slot.
        required: false
      mps_recovery_attempts:
        description: 'Optional failed scheduled run-attempt IDs, space separated (max six); MPS RSS only'
        required: false
      private_projection_b64:
        description: 'Exact reviewed metadata-only private projection, base64 JSON; no originals'
        required: false
      expected_main:
        description: 'Reviewed release only: exact main commit authorized by the owner'
        required: false
      source_commit:
        description: 'Reviewed release only: exact reviewed MPS evidence commit'
        required: false
      decision_name:
        description: 'Reviewed release only: committed config/vietnam_link_releases/<name>.json'
        required: false

concurrency:
  group: vietnam-ministry-shadow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shadow:
    if: false # Public original writer retired at the coordinated private cutover.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact collector
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: repo
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r repo/requirements.txt

      - name: Run Vietnam ministry offline contracts
        working-directory: repo
        run: python -m unittest tests.test_vietnam_ministry_remote_review -q

      - name: Download explicitly selected MPS recovery snapshots
        id: mps_recovery
        if: github.event_name == 'workflow_dispatch' && inputs.mps_recovery_attempts != ''
        working-directory: repo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_ATTEMPTS: ${{ inputs.mps_recovery_attempts }}
        run: |
          python -m scripts.vietnam_mps_rss_history --attempts "$RECOVERY_ATTEMPTS" \
            --out-dir "${RUNNER_TEMP}/vn-mps-recovery-zips"

      - name: Prepare isolated initialized state checkouts
        env:
          STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/vn-ministry-state"
          for pair in \
            vn_mps_foreign_affairs_vi:shadow/vietnam-mps-foreign-affairs \
            vn_moit_energy_vi:shadow/vietnam-moit-energy \
            vn_moit_foundational_industry_vi:shadow/vietnam-moit-foundational-industry; do
            slug=${pair%%:*}
            branch=${pair#*:}
            dest="${RUNNER_TEMP}/vn-ministry-state/${slug}"
            status=0
            git ls-remote --exit-code --heads "$STATE_REMOTE" "refs/heads/${branch}" > "${RUNNER_TEMP}/${slug}-head" || status=$?
            if [ "$status" -eq 0 ]; then
              git clone --branch "$branch" --single-branch "$STATE_REMOTE" "$dest"
            elif [ "$status" -eq 2 ]; then
              echo "::error::scheduled reliability state branch missing: $branch; refusing to restart Day 0"
              exit 1
            else
              exit "$status"
            fi
            test "$(git -C "$dest" branch --show-current)" = "$branch"
            test "$(git -C "$dest" ls-tree --name-only HEAD)" = "state"
            test -f "$dest/state/clock.json"
            test -f "$dest/state/shadow.db"
          done

      - name: Collect serial reliability batch
        id: collect
        working-directory: repo
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          MPS_RECOVERY_ATTEMPTS: ${{ inputs.mps_recovery_attempts }}
          MPS_RECOVERY_OUTCOME: ${{ steps.mps_recovery.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            schedule)
              test -z "${TARGET_DATE:-}"
              set --
              ;;
            workflow_dispatch)
              test -n "${TARGET_DATE:-}" || { echo "::error::manual recovery requires target_date"; exit 1; }
              set -- --mps-target "$TARGET_DATE" --moit-target "$TARGET_DATE"
              ;;
            *) exit 1 ;;
          esac
          if [ -n "${MPS_RECOVERY_ATTEMPTS:-}" ]; then
            if [ "$MPS_RECOVERY_OUTCOME" = success ]; then
              set -- "$@" --mps-recovery-zips "${RUNNER_TEMP}/vn-mps-recovery-zips"
            else
              # Never use a partially downloaded recovery set. Only MPS holds;
              # the independent MOIT families must still be attempted.
              set -- "$@" --mps-recovery-zips "${RUNNER_TEMP}/vn-mps-recovery-download-failed"
            fi
          fi
          python scripts/vietnam_ministry_remote.py \
            --root "${RUNNER_TEMP}/vn-ministry-state" \
            --gate-dir "${RUNNER_TEMP}/vn-ministry-host-gate" \
            "$@" --lookback 6 --cap 40 \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$(git rev-parse HEAD)" \
            --event-name "$GITHUB_EVENT_NAME" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --cron-utc "18:17" \
            --publication-list "${RUNNER_TEMP}/vn-ministry-successful-sources" \
            2>&1 | tee "${RUNNER_TEMP}/vn-ministry-run.log"

      - name: Assert collector checkout preservation
        id: preservation
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish successful state only
        if: ${{ !cancelled() && steps.preservation.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          set -euo pipefail
          collector=$(git -C "${GITHUB_WORKSPACE}/repo" rev-parse HEAD)
          publication_list="${RUNNER_TEMP}/vn-ministry-successful-sources"
          test -f "$publication_list" || exit 0
          while IFS= read -r slug; do
            case "$slug" in
              vn_mps_foreign_affairs_vi|vn_moit_energy_vi|vn_moit_foundational_industry_vi) ;;
              *) exit 1 ;;
            esac
            dest="${RUNNER_TEMP}/vn-ministry-state/${slug}"
            branch=$(git -C "$dest" branch --show-current)
            case "$branch" in
              shadow/vietnam-mps-foreign-affairs|shadow/vietnam-moit-energy|shadow/vietnam-moit-foundational-industry) ;;
              *) exit 1 ;;
            esac
            test ! -e "$dest/state/shadow.db-wal"
            test ! -e "$dest/state/shadow.db-shm"
            test ! -e "$dest/state/shadow.db-journal"
            git -C "$dest" config user.name 'github-actions[bot]'
            git -C "$dest" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$dest" add state
            git -C "$dest" diff --cached --quiet && continue
            git -C "$dest" commit -m "shadow(${slug}): run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -m "Collector ${collector}. Successful state only; never merged to main."
            git -C "$dest" push origin "HEAD:refs/heads/${branch}"
          done < "$publication_list"

      - name: Preserve complete attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-ministry-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vn-ministry-state/vn_mps_foreign_affairs_vi/state/
            ${{ runner.temp }}/vn-ministry-state/vn_moit_energy_vi/state/
            ${{ runner.temp }}/vn-ministry-state/vn_moit_foundational_industry_vi/state/
            ${{ runner.temp }}/vn-ministry-run.log
            ${{ runner.temp }}/vn-ministry-successful-sources
          if-no-files-found: warn
          retention-days: 90

  reviewed-release:
    # Inert until actual source/custody review, a sealed decision and owner release.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.operation == 'reviewed-release' &&
      github.ref == 'refs/heads/main' && vars.VIETNAM_MPS_RELEASE_ENABLED == 'true'
    concurrency:
      group: daily-update
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require exact owner-selected release and independent key
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DECISION_NAME: ${{ inputs.decision_name }}
          VIETNAM_LINK_REVIEW_KEY: ${{ secrets.VIETNAM_LINK_REVIEW_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_MAIN']
          assert re.fullmatch('[0-9a-f]{40}',os.environ['SOURCE_COMMIT'])
          assert re.fullmatch('[a-z0-9-]{1,80}',os.environ['DECISION_NAME'])
          p=Path('config/vietnam_link_releases')/(os.environ['DECISION_NAME']+'.json')
          assert p.is_file() and not p.is_symlink()
          assert len(os.environ['VIETNAM_LINK_REVIEW_KEY'].encode())>=32
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          sha256sum pla_watch.db > "$RUNNER_TEMP/vn-db.sha"
      - run: pip install -r requirements.txt
      - name: Accept only the exact permitted private metadata projection
        env:
          PROJECTION_B64: ${{ inputs.private_projection_b64 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PYTHON'
          import base64,json,os
          from pathlib import Path
          from core import vietnam_official_link_admission as vn
          raw=os.environ['PROJECTION_B64']
          assert 0 < len(raw) <= 65536
          signed=json.loads(base64.b64decode(raw,validate=True))
          assert set(signed)=={'projection','hmac_sha256'}
          vn._projection_shape(signed['projection'])
          assert signed['projection']['packet']['source_git_commit']==os.environ['SOURCE_COMMIT']
          p=Path(os.environ['RUNNER_TEMP'])/'vn-private-projection.json'
          p.write_text(json.dumps(signed,sort_keys=True));p.chmod(0o600)
          PYTHON
      - name: Validate review, admit atomically and render Vietnam only
        env:
          GH_TOKEN: ${{ github.token }}
          VIETNAM_LINK_REVIEW_KEY: ${{ secrets.VIETNAM_LINK_REVIEW_KEY }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DECISION_NAME: ${{ inputs.decision_name }}
          VIETNAM_PRIVATE_BRIDGE_KEY: ${{ secrets.VIETNAM_PRIVATE_BRIDGE_KEY }}
          VIETNAM_PRIVATE_PROVENANCE_TOKEN: ${{ secrets.VIETNAM_PRIVATE_PROVENANCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VIETNAM_PRIVATE_PROVENANCE_TOKEN"
          python -m scripts.admit_vietnam_official_links --release --database "$GITHUB_WORKSPACE/pla_watch.db" \
            --private-projection "$RUNNER_TEMP/vn-private-projection.json" \
            --signed-decision "config/vietnam_link_releases/$DECISION_NAME.json" \
            --expected-db-sha256 "$(cut -d' ' -f1 "$RUNNER_TEMP/vn-db.sha")"
          python site/render.py --out "$RUNNER_TEMP/vn-release-render"
          cp "$RUNNER_TEMP/vn-release-render/vietnam.html" output/vietnam.html
          python scripts/validate_output.py
          python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
            --site-dir output --require-desk vietnam
      - name: Commit exact DB and generated page with optimistic concurrency
        env:
          GH_TOKEN: ${{ github.token }}
          VIETNAM_PRIVATE_PROVENANCE_TOKEN: ${{ secrets.VIETNAM_PRIVATE_PROVENANCE_TOKEN }}
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json,os
          from pathlib import Path
          from core import vietnam_official_link_admission as vn
          from scripts.attest_vietnam_run_state import GithubRead
          signed=json.loads((Path(os.environ['RUNNER_TEMP'])/'vn-private-projection.json').read_text())
          vn.verify_private_projection_head(signed,GithubRead(os.environ['VIETNAM_PRIVATE_PROVENANCE_TOKEN'],repository=vn.PRIVATE_REPO),public_api=GithubRead(os.environ['GH_TOKEN']))
          PYTHON
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git add -- pla_watch.db output/vietnam.html
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^M  (pla_watch.db|output/vietnam.html)$')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Vietnam: admit exact owner-reviewed MPS official links'
            git push origin HEAD:refs/heads/main
          fi
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: vn-existing-pages
          fetch-depth: 0
      - name: Publish only Vietnam and independently read back Pages Git
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          before=$(git -C vn-existing-pages rev-parse HEAD)
          cp output/vietnam.html vn-existing-pages/vietnam.html
          git -C vn-existing-pages add -- vietnam.html
          git -C vn-existing-pages config user.name 'github-actions[bot]'
          git -C vn-existing-pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git -C vn-existing-pages diff --cached --quiet; then
            git -C vn-existing-pages commit -m 'Vietnam: publish exact reviewed official links'
          fi
          git -C vn-existing-pages fetch --quiet origin gh-pages
          test "$(git -C vn-existing-pages rev-parse origin/gh-pages)" = "$before"
          git -C vn-existing-pages push origin HEAD:refs/heads/gh-pages
          git -C vn-existing-pages fetch --quiet origin gh-pages
          git -C vn-existing-pages show origin/gh-pages:vietnam.html > "$RUNNER_TEMP/vn-pages-readback.html"
          cmp output/vietnam.html "$RUNNER_TEMP/vn-pages-readback.html"
          python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
            --site-dir output --deployed-dir vn-existing-pages --require-desk vietnam
      - name: Independent fixed-origin HTTPS readback
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
              --site-dir output --require-desk vietnam --vietnam-https; then exit 0; fi
            sleep 10
          done
          exit 1
