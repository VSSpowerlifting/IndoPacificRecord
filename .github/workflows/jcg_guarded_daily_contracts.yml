name: JCG Guarded Daily Shadow — Offline Activation Safety

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/jcg_guarded_daily_shadow.yml
      - .github/workflows/jcg_guarded_daily_contracts.yml
      - tests/test_jcg_guarded_daily_shadow_contracts.py
      - shadow/jp_jcg/manifest.json
      - docs/JAPAN_JCG_GUARDED_DAILY_SHADOW.md

permissions:
  contents: read

jobs:
  default-off-safety:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Assert no unapproved schedule activity or date drift
        run: python -m unittest tests.test_jcg_guarded_daily_shadow_contracts -v
      - name: Assert no production/output mutations
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python - <<'PY'
          # Runtime migration 3 registered the Japan MOD news feed as the desk's
          # one manual production source; the Coast Guard stays a shadow desk
          # and never enters the production manifest.
          import json
          from pathlib import Path
          production = json.loads(Path("desks/japan/manifest.json").read_text(encoding="utf-8"))
          assert [s["slug"] for s in production["sources"]] == ["jp_mod_news_ja"], production["sources"]
          assert "jcg" not in json.dumps(production).lower()
          PY
