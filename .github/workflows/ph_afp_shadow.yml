name: Philippines AFP — retired public source writer

# The original public AFP state and Git history are preserved for audit.
# Collection moved to the separately gated restricted private repository.
# This workflow has NO cron, NO manual dispatch, NO publisher access, and
# NO public AFP state writer. The historical workflow is preserved as an
# offline-only test fixture in tests/fixtures/ph_afp_public_legacy_workflow.yml.
on:
  pull_request:
    paths:
      - ".github/workflows/ph_afp_shadow.yml"
      - "tests/fixtures/ph_afp_public_legacy_workflow.yml"
      - "tests/test_ph_afp_schedule.py"
      - "scripts/audit_shadow_workflow_bindings.py"
      - "tests/test_shadow_workflow_bindings.py"

permissions:
  contents: read

jobs:
  retired-source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check retired-public-source binding and no writer
        run: python -m unittest tests.test_shadow_workflow_bindings -q
