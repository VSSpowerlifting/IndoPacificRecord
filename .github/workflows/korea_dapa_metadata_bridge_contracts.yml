name: Korea DAPA — signed private metadata bridge contracts

# Offline synthetic tests only. No source network, private credentials,
# publisher dispatch or public release on PRs.
on:
  pull_request:
    branches: [main]
    paths:
      - core/korea_dapa_private_to_production.py
      - scripts/korea_dapa_signed_metadata_bridge.py
      - tests/test_korea_dapa_private_to_production.py
      - .github/workflows/korea_dapa_metadata_bridge_contracts.yml
      - .github/workflows/korea_verified_official_link_production.yml

permissions:
  contents: read

jobs:
  no-source-signed-metadata-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify signed packet, source identity, DB admission and MND preservation
        run: |
          python -m unittest -v \
            tests.test_korea_dapa_private_to_production \
            tests.test_korea_dapa_official_metadata_policy_and_schema
      - name: Verify disabled-by-default private dispatch trust boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/korea_verified_official_link_production.yml').read_text()
          for required in (
              'DAPA_METADATA_BRIDGE_ENABLED',
              'secrets.DAPA_BRIDGE_KEY',
              'dapa_packet_b64',
              'dapa_mac',
              'scripts.korea_dapa_signed_metadata_bridge admit-public',
          ):
              assert required in text, required
          assert "DAPA_PACKET_B64: \${{ inputs.dapa_packet_b64 }}" in text
          assert "DAPA_PACKET_MAC: \${{ inputs.dapa_mac }}" in text
          print("PASS: no DAPA publication without signed dispatch and activation")
          PY
          git diff --exit-code -- pla_watch.db output/
          test -z "$(git status --porcelain --untracked-files=all -- pla_watch.db output/)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
