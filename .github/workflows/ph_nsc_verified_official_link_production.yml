name: Philippines — Verified NSC Links to Production and Pages

# Philippine National Security Council statements reach public production
# ONLY as a private-runner HMAC envelope (nsc-envelope.json.gz + .mac) signed
# from the private archive/ph-nsc custody branch. The envelope carries neutral
# link metadata (official URL, publisher date, publisher identity, provenance
# hashes); it never carries an NSC title, body, image, translation, model
# output or IPR analysis, and this runner never sees one.
#
# Held by three independent gates, none of which this workflow can open:
#   * vars.NSC_METADATA_BRIDGE_ENABLED must be 'true';
#   * secrets.NSC_BRIDGE_KEY (separate from the AFP key) must be configured;
#   * config/ph_nsc_official_link_policy.json must authorize the release
#     (standing publication, or an owner-sealed exact-version decision
#     verified with secrets.NSC_RELEASE_REVIEW_KEY).
# See docs/philippines/NSC_RIGHTS_AND_RELEASE_DECISION.md.
#
# Retry: dispatch again with the same envelope. Admission is idempotent; a
# run that pushed main but failed before Pages is reconciled by this workflow
# or by the daily Philippines link reconciliation, which renders every
# admitted Philippines family.
on:
  workflow_dispatch:
    inputs:
      envelope_b64:
        description: 'Private-runner signed, gzip metadata-only NSC envelope (base64)'
        required: true
        type: string
      envelope_mac:
        description: 'HMAC-SHA256 of the gzip envelope bytes'
        required: true
        type: string
      sealed_decision_b64:
        description: 'Optional owner-sealed exact-version decision JSON (base64)'
        required: false
        type: string

permissions:
  contents: read

# Shares the Philippines release group so AFP and NSC never race on the page.
concurrency:
  group: philippines-verified-official-link-production
  cancel-in-progress: false

jobs:
  publish-philippines-nsc-links:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Hold unless the NSC metadata bridge is activated
        env:
          BRIDGE_ENABLED: ${{ vars.NSC_METADATA_BRIDGE_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BRIDGE_ENABLED" = true || {
            echo "::error::HOLD: NSC private metadata bridge is not activated"
            exit 1
          }
      - name: Check out current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Pin exact main and refuse dirty or sidecar state
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/nsc-prod-main-before"
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
      - name: Install existing source and site dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify NSC admission, handoff and renderer contracts
        run: |
          python -m unittest -v \
            tests.test_ph_nsc_official_link_admission \
            tests.test_admit_ph_nsc_official_links \
            tests.test_regional_official_link_render
      - name: Decode the signed envelope outside the workspace
        env:
          ENVELOPE_B64: ${{ inputs.envelope_b64 }}
          ENVELOPE_MAC: ${{ inputs.envelope_mac }}
          SEALED_B64: ${{ inputs.sealed_decision_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ENVELOPE_B64" | base64 -d > "$RUNNER_TEMP/nsc-envelope.json.gz"
          printf '%s\n' "$ENVELOPE_MAC" > "$RUNNER_TEMP/nsc-envelope.mac"
          if [ -n "$SEALED_B64" ]; then
            printf '%s' "$SEALED_B64" | base64 -d > "$RUNNER_TEMP/nsc-sealed.json"
            echo "SEALED_ARGS=--sealed-decision $RUNNER_TEMP/nsc-sealed.json" >> "$GITHUB_ENV"
          fi
      - name: Admit authenticated NSC links (scratch copy, atomic replace)
        env:
          NSC_BRIDGE_KEY: ${{ secrets.NSC_BRIDGE_KEY }}
          NSC_RELEASE_REVIEW_KEY: ${{ secrets.NSC_RELEASE_REVIEW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # The only step that writes pla_watch.db. Schema first: NSC rows
          # need migration 0014's family constraints.
          python -m migrations.cli --apply --db "$GITHUB_WORKSPACE/pla_watch.db"
          python scripts/verify_db_current.py
          # shellcheck disable=SC2086
          python scripts/admit_ph_nsc_official_links.py admit \
            --production-db "$GITHUB_WORKSPACE/pla_watch.db" \
            --signed-envelope "$RUNNER_TEMP/nsc-envelope.json.gz" \
            --signed-mac "$RUNNER_TEMP/nsc-envelope.mac" ${SEALED_ARGS:-} \
            | tee "$RUNNER_TEMP/nsc-receipt.json"
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm
          python scripts/verify_db_current.py
      - name: Render site; verify the Philippines page independently
        shell: bash
        run: |
          set -euo pipefail
          python site/render.py
          python scripts/validate_output.py
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from bs4 import BeautifulSoup
          db = sqlite3.connect("file:pla_watch.db?mode=ro", uri=True)
          rows = {r[0]: r[1] for r in db.execute(
              "SELECT source_identity, canonical_official_url FROM regional_official_source_links "
              "WHERE desk='philippines'")}
          nsc = {k: v for k, v in rows.items() if k.startswith("nsc:")}
          from core import official_link_index as link_index
          from core.regional_official_link_render import load_admitted_links
          admitted = load_admitted_links(Path("pla_watch.db"), "philippines")
          assert {r["source_identity"]: r["canonical_official_url"] for r in admitted} == rows
          def listed(html):
              soup = BeautifulSoup(html, "html.parser")
              return [(li["data-regional-official-source-id"], li.find("a")["href"])
                      for li in soup.select("li[data-regional-official-source-id]")]
          page = Path("output/philippines.html").read_text(encoding="utf-8")
          # The desk lists exactly the newest DESK_LINK_LIMIT admitted links
          # (AFP, then NSC); the full index below carries every admitted link.
          shown = link_index.desk_listing("philippines", admitted)
          assert listed(page) == [
              (r["source_identity"], r["canonical_official_url"]) for r in shown
          ], "rendered Philippines desk links differ from the newest SQLite rows"
          assert page.count('href="%s"' % link_index.hub_route("philippines")) == 1
          assert all(u.startswith("https://nsc.gov.ph/") for u in nsc.values()), "NSC URL outside publisher"
          got = {}
          index_pages = [Path("output", link_index.hub_route("philippines"))]
          assert listed(index_pages[0].read_text(encoding="utf-8")) == []
          for month, month_rows in link_index.partition("philippines", admitted):
              month_path = Path("output", link_index.month_route("philippines", month))
              index_pages.append(month_path)
              month_got = listed(month_path.read_text(encoding="utf-8"))
              assert month_got == [(r["source_identity"], r["canonical_official_url"])
                                   for r in month_rows], month
              for sid, href in month_got:
                  assert sid not in got, sid
                  got[sid] = href
          # Every admitted link exactly once across the month pages.
          assert got == rows, "full official-link index differs from SQLite"
          for html in [page] + [p.read_text(encoding="utf-8") for p in index_pages]:
              for forbidden in ("title_original", "text_original", "summary_english", "<iframe"):
                  assert forbidden not in html, forbidden
          print("Admitted Philippines links rendered:", len(rows), "NSC:", len(nsc),
                "desk:", len(shown), "index pages:", len(index_pages))
          PY
          python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
            --site-dir output --require-desk philippines
          python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
            --print-routes philippines > "$RUNNER_TEMP/nsc-routes"
          test "$(head -n 1 "$RUNNER_TEMP/nsc-routes")" = "philippines.html"
          # Pre-commit budget gate: the desk and every hub/month route keep the
          # default 120 KB cap. A route over its cap, or a route the DB requires
          # but the render lacks, HOLDs this writer before anything is staged.
          only=()
          while read -r route; do only+=(--only "$route"); done < "$RUNNER_TEMP/nsc-routes"
          python scripts/verify_frontend_delivery.py --root output \
            --receipt "$RUNNER_TEMP/nsc-budget.json" "${only[@]}"
          while read -r route; do sha256sum "output/$route"; done \
            < "$RUNNER_TEMP/nsc-routes" > "$RUNNER_TEMP/nsc-prod-page-sha"
          echo "All rendered output changes listed for audit, not bulk publication:"
          git diff --name-only -- output/
      - name: Refuse a moved production main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(cat "$RUNNER_TEMP/nsc-prod-main-before")" || {
            echo "::error::Production main moved; retry rather than replacing a changed DB"
            exit 1
          }
          sha256sum -c "$RUNNER_TEMP/nsc-prod-page-sha"
      - name: Commit exactly live SQLite and Philippines HTML
        shell: bash
        run: |
          set -euo pipefail
          git add -- pla_watch.db output/philippines.html
          # The full official-link index: stage each budget-gated route by
          # name (hub plus month pages); -u records only the removal of a
          # tracked month that no longer has admitted rows. An unlisted new
          # file stays untracked and holds the Pages step before publication.
          while read -r route; do git add -- "output/$route"; done < "$RUNNER_TEMP/nsc-routes"
          if [ -n "$(git ls-files -- output/philippines-official-links.html output/philippines-official-links)" ]; then
            git add -u -- output/philippines-official-links.html output/philippines-official-links
          fi
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "No new admitted NSC links; nothing to commit"
            exit 0
          fi
          if echo "$staged" | grep -vE '^(pla_watch\.db|output/philippines\.html|output/philippines-official-links\.html|output/philippines-official-links/[0-9]{4}-[0-9]{2}\.html)$'; then
            echo "::error::Unexpected staged file; full-site publish prohibited"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Philippines: admit authenticated NSC link metadata and update page only"
          git push origin HEAD:main
      - name: Check out current Pages without uploading other files
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: philippines-existing-pages
          fetch-depth: 0
          persist-credentials: true
      - name: Publish only Philippines HTML to existing Pages branch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/nsc-prod-page-sha"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || {
            echo "::error::Main changed since this Philippines page was rendered"
            exit 1
          }
          git show HEAD:output/philippines.html | cmp - output/philippines.html
          while read -r route; do
            git show "HEAD:output/$route" | cmp - "output/$route"
          done < "$RUNNER_TEMP/nsc-routes"
          test -z "$(git ls-files --others -- output/philippines-official-links.html output/philippines-official-links)"
          python - <<'PY'
          from scripts.verify_regional_source_index_readback import verify_philippines_original_routes
          verify_philippines_original_routes("pla_watch.db", "philippines-existing-pages")
          PY
          cd philippines-existing-pages
          test -z "$(git status --porcelain --untracked-files=all)"
          pages_old="$(git rev-parse HEAD)"
          cp ../output/philippines.html philippines.html
          rm -rf philippines-official-links.html philippines-official-links
          if [ -e ../output/philippines-official-links.html ]; then
            cp ../output/philippines-official-links.html philippines-official-links.html
            cp -R ../output/philippines-official-links philippines-official-links
          fi
          while read -r route; do cmp "../output/$route" "$route"; done < "$RUNNER_TEMP/nsc-routes"
          git add -- philippines.html
          while read -r route; do git add -- "$route"; done < "$RUNNER_TEMP/nsc-routes"
          if [ -n "$(git ls-files -- philippines-official-links.html philippines-official-links)" ]; then
            git add -u -- philippines-official-links.html philippines-official-links
          fi
          staged="$(git diff --cached --name-only)"
          if [ -n "$staged" ] && echo "$staged" | grep -vE '^(philippines\.html|philippines-official-links\.html|philippines-official-links/[0-9]{4}-[0-9]{2}\.html)$'; then
            echo "::error::Unexpected staged Pages file; full-site publish prohibited"
            exit 1
          fi
          if [ -n "$staged" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Philippines: publish authenticated NSC outbound links only"
          fi
          git fetch origin gh-pages
          test "$(git rev-parse origin/gh-pages)" = "$pages_old" || {
            echo "::error::Pages moved; never overwrite a concurrent release"
            exit 1
          }
          if [ -n "$staged" ]; then
            git push origin HEAD:gh-pages
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Independent readback of committed and deployed bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main gh-pages
          main_sha="$(git show origin/main:output/philippines.html | sha256sum | cut -d' ' -f1)"
          pages_sha="$(git show origin/gh-pages:philippines.html | sha256sum | cut -d' ' -f1)"
          test "$main_sha" = "$pages_sha" || {
            echo "::error::main output and gh-pages Philippines bytes differ"
            exit 1
          }
          echo "PASS: main:output/philippines.html == gh-pages:philippines.html ($main_sha)"
          # The full index: identical month inventory and bytes on both refs.
          test "$(git ls-tree --name-only origin/main output/philippines-official-links/ | sed 's|^output/||')" = \
            "$(git ls-tree --name-only origin/gh-pages philippines-official-links/)" || {
            echo "::error::main output and gh-pages Philippines index months differ"
            exit 1
          }
          while read -r route; do
            test "$(git show "origin/main:output/$route" | sha256sum)" = \
              "$(git show "origin/gh-pages:$route" | sha256sum)" || {
              echo "::error::main output and gh-pages differ for $route"
              exit 1
            }
          done < "$RUNNER_TEMP/nsc-routes"
      - name: Independent fixed-origin HTTPS readback of desk and full index
        shell: bash
        run: |
          set -euo pipefail
          # Pages builds take 22-71 s; bounded wait (24 x 10 s), then fail.
          for attempt in $(seq 1 24); do
            if python -m scripts.verify_regional_source_index_readback --db pla_watch.db \
              --site-dir output --require-desk philippines --https-desk philippines; then exit 0; fi
            sleep 10
          done
          exit 1

# NSC originals stay in private custody (archive/ph-nsc). No source clone,
# artifact upload, bulk site push, AI request or editor email happens here.
