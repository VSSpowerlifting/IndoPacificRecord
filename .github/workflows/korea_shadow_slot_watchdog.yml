name: Korea Shadow — read-only mature collection-slot watchdog

# One day after the preceding private 17:47 UTC MND collector slot, after 6h grace.
# Only private ledger/clock metadata are read, never source originals or media.
# No collection, public writes, rights approval or Sunday Brief actions.
on:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/watch_korea_shadow_slots.py"
      - "tests/test_korea_shadow_slot_watchdog.py"
      - "tests/test_korea_prospective_seven_slots.py"
      - "scripts/audit_korea_actions_attempts.py"
      - "tests/test_korea_actions_attempts.py"
      - ".github/workflows/korea_shadow_slot_watchdog.yml"

permissions:
  contents: read

concurrency:
  group: korea-readonly-slot-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test mature-slot boundaries, logical provenance and no source release
        run: python -m unittest tests.test_korea_shadow_slot_watchdog tests.test_korea_prospective_seven_slots tests.test_korea_actions_attempts -v
      - name: Assert production and desk configuration unchanged
        run: git diff --exit-code -- pla_watch.db output/ shadow/

  inspect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout observer code, never persist write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify synthetic calendar and schedule/recovery separation
        run: python -m unittest tests.test_korea_shadow_slot_watchdog tests.test_korea_prospective_seven_slots -q
      - name: Fetch ONLY metadata of authenticated private MND archive Git tip
        env:
          KOREA_VAULT_READ_TOKEN: ${{ secrets.IPR_KOREA_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export GIT_TERMINAL_PROMPT=0
          test -n "${KOREA_VAULT_READ_TOKEN:-}" || {
            echo "::error::Private MND archive read token unavailable; refuse misleading watchdog result"
            exit 1
          }
          auth="$(printf 'x-access-token:%s' "$KOREA_VAULT_READ_TOKEN" | base64 -w0)"
          repo="$RUNNER_TEMP/korea-watch-state"
          git init -q "$repo"
          git -C "$repo" remote add origin             "https://github.com/VSSpowerlifting/ipr-source-evidence-private.git"
          git -C "$repo" sparse-checkout init --no-cone
          git -C "$repo" sparse-checkout set '/state/ledger/**' '/state/clock.json'
          git -C "$repo" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"             fetch --quiet --no-tags --depth=1 --filter=blob:none             origin refs/heads/archive/korea-policy-briefing
          # Blob-filtered fetch lazily downloads selected ledger objects at checkout.
          # Authenticate that read too, without writing credentials to Git config.
          git -C "$repo" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            checkout -q -b archive/korea-policy-briefing FETCH_HEAD
          test "$(git -C "$repo" branch --show-current)" = archive/korea-policy-briefing
          test "$(git -C "$repo" ls-tree --name-only HEAD)" = state
          test -d "$repo/state/ledger"
          test -f "$repo/state/clock.json"
          test ! -e "$repo/state/shadow.db"
          test ! -e "$repo/state/captures"
          test -z "$(git -C "$repo" status --porcelain --untracked-files=all)"
      - name: Verify matured collection slots (no Actions census or body review)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.watch_korea_shadow_slots \
            --shadow-checkout "$RUNNER_TEMP/korea-watch-state" \
            --fail-current-gap
      - name: Verify code, site and production state unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pla_watch.db output/ shadow/
          test ! -e pla_watch.db-wal
          test ! -e pla_watch.db-shm

# Private custody ledger-only metadata appears only in the Actions log. No artifacts, original files,
# emailed content, workflow dispatches, state pushes or human signoffs.
